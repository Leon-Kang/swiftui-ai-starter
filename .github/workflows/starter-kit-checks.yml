name: Starter Kit Checks

concurrency:
  group: starter-kit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 1"

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run convention checks
        run: bash scripts/check-project-conventions.sh .

      - name: Run component registry checks
        run: bash scripts/check-component-registry.sh .

      - name: Compile templates and run AI policy tests
        run: swift test

      - name: Test starter example as an external consumer
        run: swift test --package-path Examples/StarterExample

      - name: Lint Swift templates
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint lint --strict
